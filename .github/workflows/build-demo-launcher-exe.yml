name: Build Demo Launcher EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "demo_launcher/**"
      - "icon.ico"
      - ".github/workflows/build-demo-launcher-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller
          --onefile
          --console
          --name INSEVIG_Demo
          --icon=icon.ico
          demo_launcher/lanzador_demo.py

      - uses: actions/upload-artifact@v4
        with:
          name: INSEVIG_Demo-windows
          path: dist/INSEVIG_Demo.exe
          retention-days: 30
