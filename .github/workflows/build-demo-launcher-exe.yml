name: Build Demo Launcher EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "demo_launcher/**"
      - "icon.ico"
      - ".github/workflows/build-demo-launcher-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller
          --onefile
          --console
          --name INSEVIG_Demo
          --icon=icon.ico
          demo_launcher/lanzador_demo.py

      - uses: actions/upload-artifact@v4
        with:
          name: INSEVIG_Demo-windows
          path: dist/INSEVIG_Demo.exe
          retention-days: 30

      # Publica el .exe en un release de tag rodante 'demo' para tener una
      # URL de descarga directa y permanente:
      #   https://github.com/<owner>/<repo>/releases/latest/download/INSEVIG_Demo.exe
      - name: Publish to rolling 'demo' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete demo --yes --cleanup-tag || echo "no previo"
          gh release create demo dist/INSEVIG_Demo.exe --title "Demo - Lanzador INSEVIG" --notes "Lanzador de la app web INSEVIG (Reflex). Doble clic abre el sistema en el navegador. Ver demo_launcher/README.md. Se actualiza en cada build." --latest
