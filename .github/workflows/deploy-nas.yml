# Despliegue automático al NAS 192.168.2.181 al hacer push a main.
#
# Requiere un "self-hosted runner" de GitHub Actions instalado en el NAS
# con las etiquetas [self-hosted, windows, insevig-nas]
# (ver deploy/windows/instalar-runner.ps1).
#
# Qué hace en el NAS: git pull (implícito en checkout) -> pip install ->
# alembic upgrade -> seed -> Restart-Service insevig-web -> healthcheck.
#
# Si NO hay runner instalado, este workflow simplemente queda "en cola" y no
# molesta a nadie; el despliegue manual (Actualizar-INSEVIG.bat) sigue funcionando.

name: Desplegar al NAS

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "insevig_web/**"
      - "assets/**"
      - "alembic/**"
      - "scripts/**"
      - "pyproject.toml"
      - "rxconfig.py"
      - ".github/workflows/deploy-nas.yml"
  workflow_dispatch: {}   # permite dispararlo a mano desde la pestaña Actions

concurrency:
  group: deploy-nas
  cancel-in-progress: false   # nunca cortar un deploy a medias

jobs:
  deploy:
    runs-on: [self-hosted, windows, insevig-nas]
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: E:\Sistemas_Dev\NOMINA_ROLES_SISTEMA_INSEVIG

    steps:
      - name: Traer el codigo (git pull)
        run: |
          git fetch --all --prune
          git reset --hard origin/main

      - name: Dependencias
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[web]"

      - name: Migraciones + usuario admin
        run: |
          .\.venv\Scripts\python.exe -m alembic upgrade head
          .\.venv\Scripts\python.exe -m insevig_web.seed

      - name: Reiniciar el servicio
        run: Restart-Service insevig-web

      - name: Verificar que responde
        run: |
          $ok = $false
          for ($i = 0; $i -lt 24; $i++) {
            try {
              $r = Invoke-WebRequest "http://localhost:3000/" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep 5
          }
          if (-not $ok) {
            Write-Host "El servicio no respondio 200 en 2 min. Revisa C:\insevig\logs\insevig-web.err.log"
            exit 1
          }
          Write-Host "OK -> http://192.168.2.181:3000 desplegado."
