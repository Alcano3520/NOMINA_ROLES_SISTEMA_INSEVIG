# Ruta opcional (Linux). Levanta app + Postgres + Caddy.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: insevig_app
      POSTGRES_USER: insevig_app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    env_file: [../../.env]
    environment:
      APP_DB_URL: postgresql+psycopg://insevig_app:${APP_DB_PASSWORD}@db:5432/insevig_app
    depends_on: [db]
    volumes:
      - storage:/app/var/storage
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["443:443", "80:80"]
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  caddydata:
