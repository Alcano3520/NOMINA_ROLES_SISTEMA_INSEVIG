# Migraciones de la BD propia de la app (auth, auditoría, jobs, config, préstamos migrados).
# NO es la BD de nómina (SQL Server) ni Supabase.
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# sqlalchemy.url se toma de core.config.get_settings().app_db_url en env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
