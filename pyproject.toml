[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insevig-core"
version = "0.1.0"
description = "Núcleo de negocio (sin UI) del sistema INSEVIG RRHH/Nómina — migración a Reflex"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pandas>=2.2",
    "pyodbc>=5.1",
    "supabase==2.7.4",
    "pyyaml>=6.0",
    "reportlab>=4.1",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "jinja2>=3.1",
    "httpx>=0.27,<0.28",  # supabase 2.7.4 requiere <0.28
    "sqlmodel>=0.0.21",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
web = [
    "reflex==0.9.10.post1",
    "bcrypt>=4.1",
    "itsdangerous>=2.1",
    "msal>=1.28",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pypdf>=4"]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: prueba que requiere SQL Server o Supabase reales"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "*.pyw", "HISTORIAL PRESTAMOS", "TOTAL_OSERVACIONES"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "SIM300", "SIM117"]
"insevig_web/pages/**" = ["E501"]
"insevig_web/components/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["core"]
ignore_missing_imports = true
